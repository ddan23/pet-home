# 猫狗宠物之家 本地开发 Redis
# 用法：docker compose -f deploy/redis/docker-compose.yml up -d
# 说明：
#   1. 端口只绑定 127.0.0.1，禁止暴露到局域网/公网（开发规范红线）
#   2. ACL 账号：用户名 root / 密码 1234；default 匿名用户已禁用
#   3. 数据持久化到 D:/project/pethome_date（AOF + RDB 双写）
#   4. 上生产前：密码必须改强口令并走环境变量，不得沿用开发默认值
services:
  redis:
    image: redis:7.4-alpine
    container_name: pethome-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - D:/project/pethome_date:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user root --pass 1234 ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
