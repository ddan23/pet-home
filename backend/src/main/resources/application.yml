server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /petHome
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types:
      - application/json
      - application/javascript
      - text/css
      - text/html
      - text/plain
      - image/svg+xml

spring:
  # 本地开发从 backend/.env.local 读取凭据，文件不存在时静默跳过（生产仍用环境变量）
  config:
    import: optional:file:./.env.local[.properties]
  application:
    name: pet-home
  mvc:
    async:
      request-timeout: ${AI_STREAM_TIMEOUT_MILLIS:120000}
  profiles:
    default: dev
  # Spring AI 官方 DeepSeek starter 自动装配 chat 模型；
  # Milvus 自动配置被排除（它无条件建立连接，违背 RAG 可选语义），由 RagVectorStoreConfig 按开关手动装配
  autoconfigure:
    exclude: org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
  # Spring AI 官方配置节：DeepSeek chat 参数
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          max-tokens: ${DEEPSEEK_MAX_TOKENS:2048}
          temperature: ${DEEPSEEK_TEMPERATURE:0.2}
    # MCP Server（SSE 传输，实际端点挂 context-path 下：/petHome/sse 与 /petHome/mcp/message）。
    # starter 不自带鉴权：生产环境先在 application-prod.yml 显式关闭，公网暴露前必须加访问边界
    mcp:
      server:
        enabled: true
        name: pet-home-mcp-server
        version: 1.0.0
        type: SYNC
        instructions: "猫狗宠物之家 MCP 服务器：提供宠物健康档案查询与健康知识库检索工具。调用健康档案工具需要用户提供 userId 与 petId。"
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
        capabilities:
          tool: true
          resource: true
          prompt: false
          completion: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/pet_home?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # ACL 账号，容器侧由 deploy/redis/redis.conf 定义；上生产必须换成环境变量强口令
      username: ${REDIS_USERNAME:root}
      password: ${REDIS_PASSWORD:1234}
      timeout: ${REDIS_TIMEOUT_MILLIS:3000}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT_MILLIS:2000}
  # RabbitMQ：评论审核、通知扇出与订单超时关单三条消息链路；本机 5672/15672 被另一项目占用，
  # 宠物之家容器映射到 5673（AMQP）/15673（管理台），凭据为开发默认值，可被环境变量覆盖
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:1234}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 发布方确认：broker 落盘失败或消息不可路由时回调 RabbitMqConfig 中的日志钩子
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      # 开启 mandatory 后，不可路由的消息会回调 ReturnsCallback 而不是被 broker 静默丢弃
      mandatory: true
    listener:
      simple:
        # auto：方法正常返回即 ack，抛异常触发消费侧重试
        acknowledge-mode: auto
        prefetch: 5
        # 重试耗尽后消息不重回队列，避免毒消息无限循环；订单链路由兜底轮询、评论链路由人工复核兜底
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2.0
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  sql:
    init:
      mode: never
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          must-revalidate: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hnist.entity,com.hnist.domain,com.hnist.dto,com.hnist.vo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

app:
  health-report:
    font-path: ${HEALTH_REPORT_FONT_PATH:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    cookie-name: ${JWT_COOKIE_NAME:pet_home_token}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  upload:
    root: ${APP_UPLOAD_ROOT:./uploads}
    user-quota-bytes: ${UPLOAD_USER_QUOTA_BYTES:52428800}
    merchant-quota-bytes: ${UPLOAD_MERCHANT_QUOTA_BYTES:209715200}
  ai:
    # 业务开关与配额
    enabled: ${DEEPSEEK_ENABLED:true}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:2048}
    max-history-messages: ${DEEPSEEK_MAX_HISTORY_MESSAGES:12}
    daily-limit: ${DEEPSEEK_DAILY_LIMIT:20}
    minute-limit: ${DEEPSEEK_MINUTE_LIMIT:5}
    rag:
      # RAG 业务开关：打开时装配 Milvus 客户端与向量库（要求 Milvus 在线），关闭时零连接
      enabled: ${RAG_ENABLED:false}
      milvus-uri: ${MILVUS_URI:http://127.0.0.1:19530}
      milvus-token: ${MILVUS_TOKEN:}
      collection-name: ${MILVUS_COLLECTION_NAME:pet_knowledge_chunks_v2}
      database-name: ${MILVUS_DATABASE:default}
      # 百炼 Embedding 走官方 OpenAI 兼容端点，由 Spring AI 的 OpenAiEmbeddingModel 承接
      embedding-api-key: ${DASHSCOPE_API_KEY:}
      embedding-base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      embedding-model: ${EMBEDDING_MODEL:text-embedding-v4}
      dimension: ${EMBEDDING_DIMENSION:1024}
      embedding-batch-size: ${EMBEDDING_BATCH_SIZE:10}
      top-k: ${RAG_TOP_K:4}
      candidate-multiplier: ${RAG_CANDIDATE_MULTIPLIER:2}
      rrf-k: ${RAG_RRF_K:60}
  mcp:
    security:
      # MCP 端点 API Key 边界开关（MCP_SECURITY_ENABLED）：开发默认关闭便于 Inspector 本地直连；
      # 生产环境必须在 application-prod.yml 开启，key 通过环境变量注入且无默认值
      enabled: ${MCP_SECURITY_ENABLED:false}
      api-key: ${MCP_API_KEY:}

logging:
  level:
    root: INFO
    com.hnist: INFO
